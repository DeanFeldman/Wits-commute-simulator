name: Build deployment ZIP

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cd dist && zip -qr ../dist.zip .
      - name: Publish latest deployment ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete deployment-latest -y --cleanup-tag || true
          gh release create deployment-latest dist.zip --target "$GITHUB_SHA" --title "Latest deployment build" --notes "Automatically built from main."
