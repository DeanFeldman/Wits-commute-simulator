<!doctype html>
<html lang="en">
  <head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Wits Commute Simulator - Three.js CGV group project starter"
    />
    <title>Wits Commute Simulator</title>
  </head>
  <body>
    <div id="game-container"></div>
    <div id="level2-vignette"></div>
    <div id="fade-overlay" aria-hidden="true"></div>
    <section id="level-intro" aria-label="Journey introduction" hidden>
      <img
        id="level-intro-art"
        class="level-intro-art"
        src=""
        alt=""
        draggable="false"
        hidden
      />
      <div id="level-intro-placeholder" class="level-intro-placeholder" hidden>
        <span id="level-intro-placeholder-icon" class="level-intro-placeholder-icon" aria-hidden="true"></span>
      </div>
      <div class="level-intro-status" aria-live="polite">
        <span class="level-intro-status-light" aria-hidden="true"></span>
        <span id="level-intro-status-copy">Loading...</span>
      </div>
      <div class="level-intro-dialogue" aria-live="polite">
        <p id="level-intro-dialogue-copy"></p>
        <button id="level-intro-dialogue-continue" type="button">
          Continue
          <span aria-hidden="true">&#9660;</span>
        </button>
      </div>
    </section>
    <div id="level3-zoom-overlay" aria-hidden="true" hidden>
      <img
        src="./assets/images/ui/level3-zoom-hands.png"
        alt=""
        draggable="false"
      />
    </div>

    <div id="top-bar">
      <strong>Wits Commute Sim</strong>
      <span id="level-name">Loading…</span>
      <span class="spacer"></span>
      <span>P = pause</span>
    </div>

    <div id="hud"></div>
    <aside id="setback-banner" class="setback-banner" aria-live="assertive" hidden>
      <p class="setback-kicker">Setback</p>
      <h2 id="setback-title" class="setback-title"></h2>
      <p id="setback-reason" class="setback-reason"></p>
      <p id="setback-next" class="setback-next"></p>
    </aside>
    <div id="message"></div>
    <button id="level1-view-toggle" type="button" aria-pressed="false" hidden>
      Sky view
    </button>

    <main id="menu" aria-live="polite">
      <section class="menu-card" aria-labelledby="menu-title">
        <p class="menu-kicker">COMS3006A / COMS3025A</p>
        <h1 id="menu-title">Wits Commute Simulator</h1>
        <div id="menu-copy">Park. Cross. Cheat.</div>
        <button id="menu-primary-action" data-game-action="start" type="button">
          Start journey
        </button>
        <button id="menu-credits-action" data-game-action="credits" type="button">
          Credits &amp; licences
        </button>
        <div id="dev-level-select" hidden>
          <p>Choose route</p>
          <button data-game-action="level-1" type="button">
            <span class="menu-level-title">Level 1</span>
            <span class="menu-level-subtitle">Parking Escape</span>
          </button>
          <button data-game-action="level-2" type="button">
            <span class="menu-level-title">Level 2</span>
            <span class="menu-level-subtitle">Campus Crossing</span>
          </button>
          <button data-game-action="level-3" type="button">
            <span class="menu-level-title">Level 3</span>
            <span class="menu-level-subtitle">Stealth Challenge</span>
          </button>
        </div>
      </section>
    </main>



    <section id="instruction-card" hidden aria-live="polite">
      <div class="menu-card">
        <p class="menu-kicker">LEVEL BRIEF</p>
        <h2 id="instruction-title"></h2>
        <p id="instruction-copy"></p>
        <button data-instruction-action="dismiss" type="button">Got it</button>
      </div>
    </section>
    <section id="quiz-overlay" hidden aria-label="Questionnaire">
      <div class="menu-card">
        <p class="menu-kicker" id="quiz-title">Quiz</p>
        <p id="quiz-intro"></p>
        <h2 id="quiz-prompt"></h2>
        <div id="quiz-body" class="quiz-body"></div>
        <p id="quiz-error" class="quiz-error" role="alert"></p>
        <button id="quiz-submit" type="button">Submit</button>
      </div>
    </section>
    <section id="pause-menu" hidden aria-label="Pause menu">
      <div class="menu-card">
        <p class="menu-kicker">LEVEL 3 CONTROLS</p>
        <h2>Paused</h2>
        <label id="sensitivity-control" class="sensitivity-control" for="look-sensitivity">
          Look sensitivity
          <input id="look-sensitivity" type="range" min="0.4" max="2" step="0.1" value="1" />
          <output id="look-sensitivity-value">1.0x</output>
        </label>
        <button data-pause-action="resume" type="button">Resume</button>
      </div>
    </section>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
